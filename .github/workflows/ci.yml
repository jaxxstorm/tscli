name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Setup gotestfmt
        uses: gotesttools/gotestfmt-action@v2
        with:
          token: ${{ github.token }}

      - name: Run Go tests (formatted)
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test -json -v ./... 2>&1 | tee /tmp/gotest-root.log | gotestfmt || status=1
          go -C tools test -json -v ./... 2>&1 | tee /tmp/gotest-tools.log | gotestfmt || status=1
          exit "$status"

      - name: Verify generated docs
        run: make docs-check

      - name: Coverage gap report
        run: make coverage-gaps-check

      - name: Upload coverage gap artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-gaps
          path: coverage/
